<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master</title>
    <style>
        /* Full-page background image from local PC */
        body {
            display: flex;
            justify-content: center;  /* Centers horizontally */
            align-items: center;  /* Centers vertically */
            height: 100vh;  /* Full viewport height */
            margin: 0;
            background-image: url('/static/bg_quizmaster.jpeg');  /* Replace with your image path */
            background-size: contain;  /* Ensures the image covers the whole screen */
            background-position: center;  /* Centers the background */
            background-repeat: no-repeat;  /* Prevents repeating */
            color: rgb(10, 9, 9);  /* Text color */
            font-family: "Lato", sans-serif;
        }

        /* Styling the heading */
        h3 {
            font-size: 70px;
            font-weight: bold;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px; /* Rounded corners */
        }
    </style>
</head>
<body>
    <h3>Welcome to Quiz Master<br>
    <a href="/login">Login</a></h3>
</body>
</html>
